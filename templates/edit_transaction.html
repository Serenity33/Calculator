{% extends "base.html" %}
{% block title %}Edit Transaction{% endblock %}
{% block content %}

<div style="max-width:520px;">
  <div class="page-header">
    <div class="page-title">Edit Transaction</div>
  </div>

  {% if error %}
  <div class="error-msg">{{ error }}</div>
  {% endif %}

  <div class="card">
    <form method="POST">
      <div class="type-toggle">
        <input type="radio" name="type" id="t-income" value="income" {{ 'checked' if txn.type == 'income' }}
               onchange="updateCategories('income')">
        <label for="t-income">💰 Income</label>
        <input type="radio" name="type" id="t-expense" value="expense" {{ 'checked' if txn.type == 'expense' }}
               onchange="updateCategories('expense')">
        <label for="t-expense">💸 Expense</label>
      </div>

      <div class="form-group">
        <label for="amount">Amount ({{ currency }})</label>
        <input type="number" id="amount" name="amount" step="0.01" min="0.01"
               value="{{ txn.amount }}" required autofocus>
      </div>

      <div class="form-group">
        <label for="tax_amount">Tax ({{ currency }})</label>
        <input type="number" id="tax_amount" name="tax_amount" step="0.01" min="0"
               value="{{ txn.tax_amount }}" placeholder="0.00">
      </div>

      <div class="form-group">
        <label for="category_id">Category</label>
        <select id="category_id" name="category_id">
          <option value="">— No category —</option>
          {% for cat in categories %}
          <option value="{{ cat.id }}" {{ 'selected' if cat.id == txn.category_id }}>{{ cat.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="new_category">Or create new category</label>
        <input type="text" id="new_category" name="new_category" placeholder="New category name">
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <input type="text" id="description" name="description"
               value="{{ txn.description or '' }}" placeholder="Optional note">
      </div>

      <div class="form-group">
        <label for="date">Date</label>
        <input type="date" id="date" name="date" value="{{ txn.date }}">
      </div>

      <div style="display:flex;gap:10px;">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('transactions', biz_id=biz.id) }}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>

<script>
  function updateCategories(type) {
    const url = new URL(window.location.href);
    url.searchParams.set('type', type);
    window.location.href = url.toString();
  }
</script>
{% endblock %}
